<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CStore Dashboard</title>

<style>
body { font-family: Arial; background:#f4f4f4; padding:20px; }
.container { max-width:900px; margin:auto; }

input, button {
  width:100%;
  padding:10px;
  margin:5px 0;
}

.branch-card {
  background:#fff;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.nearest { border:2px solid green; }

.branch-name { font-size:18px; font-weight:bold; }
.branch-distance, .branch-price { margin-top:5px; }
</style>

</head>

<body>

<div class="container">

<h2>🚀 CStore Dashboard</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>

<hr>

<input id="lat" placeholder="Latitude">
<input id="lng" placeholder="Longitude">
<button id="calcBtn">Calculate</button>

<div id="result"></div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
